name: 构建固件并附加到 Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "需要构建的版本标签，例如 v1.7.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: clock-firmware-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: ESP32-S3 固件
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 确定构建版本
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c '
          import os, re, sys
          raw = os.environ.get("REQUESTED_VERSION", "")
          if raw.startswith("refs/tags/"):
              raw = raw[len("refs/tags/"):]
          cleaned = re.sub(r"[\s\u00a0\u200b-\u200d\u2060\ufeff]", "", raw)
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", cleaned):
              print(f"版本格式无效：{raw}", file=sys.stderr)
              sys.exit(1)
          print(cleaned)
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "构建版本: $version (原始输入: $REQUESTED_VERSION)"

      - name: 检出待发布源码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.version }}
          fetch-depth: 0
          submodules: recursive

      - name: 校验源码版本
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/.*PROJECT_VER \"\(v[^\"]*\)\".*/\1/p' RLCD_CLOCK/CMakeLists.txt | head -n 1)"
          if [[ "$project_version" != "$EXPECTED_VERSION" ]]; then
            echo "标签版本 $EXPECTED_VERSION 与工程版本 $project_version 不一致" >&2
            exit 1
          fi

      - name: 准备 OTA 端点
        env:
          OTA_MANIFEST_URL: ${{ vars.WEATHER_CLOCK_OTA_MANIFEST_URL || format('https://raw.githubusercontent.com/{0}/main/firmware/latest.json', github.repository) }}
          OTA_BACKUP_MANIFEST_URL: ${{ vars.WEATHER_CLOCK_OTA_BACKUP_MANIFEST_URL || format('https://cdn.jsdelivr.net/gh/{0}@main/firmware/latest.json', github.repository) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_ota_endpoint.py \
            --output RLCD_CLOCK/main/core/ota_endpoint_local.h
          test -s RLCD_CLOCK/main/core/ota_endpoint_local.h
          echo "OTA 端点已注入"

      - name: 编译固件
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: RLCD_CLOCK
          command: idf.py build

      - name: 生成双固件
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 复制 app bin ==="
          test -f RLCD_CLOCK/build/weather_clock.bin
          cp RLCD_CLOCK/build/weather_clock.bin weather_clock_${VERSION}.bin
          echo "=== 合并固件 ==="
          pip install esptool -q
          cd RLCD_CLOCK/build
          # esptool v4 使用 merge_bin，v5 使用 merge-bin，兼容两者
          if esptool.py --chip esp32s3 merge_bin -o ../../weather_clock_${VERSION}_merged.bin @flash_args; then
            echo "merge_bin 成功"
          else
            echo "merge_bin 失败，尝试 merge-bin"
            python -m esptool --chip esp32s3 merge-bin -o ../../weather_clock_${VERSION}_merged.bin @flash_args
          fi
          cd ../..
          ls -lh weather_clock_${VERSION}.bin weather_clock_${VERSION}_merged.bin
          sha256sum weather_clock_${VERSION}.bin weather_clock_${VERSION}_merged.bin

      - name: 校验构建产物
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "weather_clock_${VERSION}.bin"
          test -s "weather_clock_${VERSION}_merged.bin"

      - name: 生成 OTA 清单
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_base="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION"
          python3 .github/scripts/update_manifests.py \
            --version "$VERSION" \
            --app "weather_clock_${VERSION}.bin" \
            --merged "weather_clock_${VERSION}_merged.bin" \
            --artifact-base "$artifact_base" \
            --notes-file firmware/OTA_RELEASE_NOTES.md \
            --latest firmware/latest.json \
            --versions firmware/versions.json

      - name: 创建或更新 Release 并上传固件
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ github.event.release.body }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "${NOTES:-详见 firmware/OTA_RELEASE_NOTES.md}"
          fi
          gh release upload "$VERSION" \
            "weather_clock_${VERSION}.bin" \
            "weather_clock_${VERSION}_merged.bin" \
            --clobber

      - name: 更新源码仓库 OTA 清单
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cp firmware/latest.json "$RUNNER_TEMP/latest.json"
          cp firmware/versions.json "$RUNNER_TEMP/versions.json"
          git config user.name "GitHub Actions Firmware Builder"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # main 同时被 AI 简报定时任务等流程写入，推送可能被拒绝，这里重试几次。
          for attempt in 1 2 3; do
            echo "=== OTA 清单推送尝试 ${attempt}/3 ==="
            git fetch origin main
            # 「生成 OTA 清单」步骤已就地改写了这两个受版本控制的文件。
            # 标签树与 main 的清单版本不同，若不先还原工作区与暂存区，
            # git checkout 会以 "Your local changes ... would be overwritten" 中止。
            # 生成结果已备份到 $RUNNER_TEMP，还原不会丢失内容。
            git checkout HEAD -- firmware/latest.json firmware/versions.json
            git checkout -B ota-manifest-update origin/main
            cp "$RUNNER_TEMP/latest.json" firmware/latest.json
            cp "$RUNNER_TEMP/versions.json" firmware/versions.json
            if git diff --quiet -- firmware/latest.json firmware/versions.json; then
              echo "OTA 清单无需更新"
              exit 0
            fi
            git add firmware/latest.json firmware/versions.json
            git commit -m "Update ${VERSION} OTA manifests [skip ci]"
            if git push origin HEAD:main; then
              echo "OTA 清单已推送到 main"
              exit 0
            fi
            echo "推送失败：main 可能刚被其他工作流更新，稍后重试" >&2
            sleep $((attempt * 10))
          done
          echo "OTA 清单连续 3 次推送失败" >&2
          exit 1

      - name: 自动递增版本号（为下一次发布准备）
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B version-bump origin/main
          current_ver="$(sed -n 's/.*PROJECT_VER \"\(v[^\"]*\)\".*/\1/p' RLCD_CLOCK/CMakeLists.txt | head -n 1)"
          echo "main 当前版本: $current_ver, 刚发布版本: $VERSION"
          if [[ "$current_ver" != "$VERSION" ]]; then
            echo "main 版本已不是 $VERSION（可能是已 bump），跳过自动递增"
            exit 0
          fi
          python3 .github/scripts/bump_version.py
          new_ver="$(sed -n 's/.*PROJECT_VER \"\(v[^\"]*\)\".*/\1/p' RLCD_CLOCK/CMakeLists.txt | head -n 1)"
          echo "新版本: $new_ver"
          git config user.name "GitHub Actions Firmware Builder"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RLCD_CLOCK/CMakeLists.txt firmware/OTA_RELEASE_NOTES.md
          git commit -m "chore: bump version ${VERSION} -> ${new_ver} [skip ci]"
          git push origin HEAD:main
          echo "已自动递增版本号到 $new_ver"

      - name: 保存 Actions 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: weather-clock-${{ steps.version.outputs.version }}
          path: |
            weather_clock_${{ steps.version.outputs.version }}.bin
            weather_clock_${{ steps.version.outputs.version }}_merged.bin
            firmware/latest.json
            firmware/versions.json
          if-no-files-found: error
          retention-days: 14
