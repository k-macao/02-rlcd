name: zz-probe (temporary)

on:
  push:
    branches: ["arena/**"]
    paths:
      - "_probe/probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: python3 _probe/probe.py > _probe/out.json
      - name: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _probe/out.json
          git commit -m "probe output [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
