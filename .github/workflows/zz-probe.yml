name: zz-probe (temporary)

# 临时工作流：合并前用发布流水线同款的 ESP-IDF v5.5.3 容器完整编译一次固件
# （本次改了腾讯行情地址和解析表）。结果写成运行注解，验证完成后删除本文件。

on:
  push:
    branches: ["arena/adcdb213-02-rlcd"]
    paths:
      - ".github/workflows/zz-probe.yml"

permissions:
  contents: read

jobs:
  firmware:
    name: ESP-IDF build check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: OTA endpoint header
        env:
          OTA_MANIFEST_URL: ${{ format('https://raw.githubusercontent.com/{0}/main/firmware/latest.json', github.repository) }}
          OTA_BACKUP_MANIFEST_URL: ${{ format('https://cdn.jsdelivr.net/gh/{0}@main/firmware/latest.json', github.repository) }}
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_ota_endpoint.py \
            --output RLCD_CLOCK/main/core/ota_endpoint_local.h
          test -s RLCD_CLOCK/main/core/ota_endpoint_local.h

      - name: Build
        run: |
          set +e
          set -uo pipefail
          docker run --rm \
            -e IDF_TARGET=esp32s3 \
            -v "$GITHUB_WORKSPACE:/app/repo" \
            -w "/app/repo/RLCD_CLOCK" \
            espressif/idf:v5.5.3 \
            /bin/bash -c 'git config --global --add safe.directory "*" && idf.py build' > /tmp/build.log 2>&1
          status=$?
          tail -5 /tmp/build.log
          errors=$(grep -c ' error: ' /tmp/build.log)
          project_warnings=$(grep -E '/app/repo/RLCD_CLOCK/main/.*warning: ' /tmp/build.log | sort -u | wc -l)
          all_warnings=$(grep -c 'warning: ' /tmp/build.log)
          size=$(grep -E 'binary size 0x[0-9a-f]+ bytes' /tmp/build.log | tail -1 | tr -s ' ')
          market=$(strings RLCD_CLOCK/build/weather_clock.bin 2>/dev/null | grep -m1 'qt.gtimg.cn')
          lines=$(wc -l < /tmp/build.log)
          summary="commit=${GITHUB_SHA:0:7} exit=${status} log_lines=${lines} errors=${errors} project_warnings=${project_warnings} all_warnings=${all_warnings} | ${size} | url_in_bin=${market}"
          escape() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          if [[ "$status" == "0" ]]; then
            echo "::notice title=ESP-IDF build::${summary}"
          else
            detail=$( { grep -n -m8 -E ' error: |Error|ERROR|FAILED|failed' /tmp/build.log; echo '--- tail ---'; tail -n 25 /tmp/build.log; } | cut -c1-300 | escape)
            echo "::error title=ESP-IDF build::${summary}%0A${detail}"
          fi
          exit "$status"
