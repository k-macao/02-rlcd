name: zz-probe (temporary)

# 临时工作流：合并前在分支上做两件本地沙箱做不了的验证，结果提交回 _probe/。
#   firmware：用发布流水线同款的 ESP-IDF v5.5.3 容器完整编译固件；
#   live    ：在 Actions 里实抓四个行情接口并渲染面板。
# 验证完成后连同 _probe/ 一起删除。

on:
  push:
    branches: ["arena/b08c6076-02-rlcd"]
    paths:
      - ".github/workflows/zz-probe.yml"
      - "_probe/report.py"
      - "RLCD_CLOCK/**"
      - "device_brief/**"

permissions:
  contents: write

jobs:
  firmware:
    name: ESP-IDF build check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: OTA endpoint header
        env:
          OTA_MANIFEST_URL: ${{ format('https://raw.githubusercontent.com/{0}/main/firmware/latest.json', github.repository) }}
          OTA_BACKUP_MANIFEST_URL: ${{ format('https://cdn.jsdelivr.net/gh/{0}@main/firmware/latest.json', github.repository) }}
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_ota_endpoint.py \
            --output RLCD_CLOCK/main/core/ota_endpoint_local.h
          test -s RLCD_CLOCK/main/core/ota_endpoint_local.h

      - name: Build
        id: build
        run: |
          set -uo pipefail
          docker run --rm \
            -e IDF_TARGET=esp32s3 \
            -v "$GITHUB_WORKSPACE:/app/repo" \
            -w "/app/repo/RLCD_CLOCK" \
            espressif/idf:v5.5.3 \
            /bin/bash -c 'git config --global --add safe.directory "*" && idf.py build' > /tmp/build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -5 /tmp/build.log
          python3 _probe/report.py /tmp/build.log "$status" /tmp/build_report.txt
          exit 0

      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          test -f /tmp/build_report.txt || echo "no report (build step did not run)" > /tmp/build_report.txt
          sed -i "1i commit=${SHA}" /tmp/build_report.txt
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/pub
            git clone -q --depth 1 -b "${GITHUB_REF_NAME}" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pub || { sleep 5; continue; }
            mkdir -p /tmp/pub/_probe
            cp /tmp/build_report.txt /tmp/pub/_probe/build_report.txt
            cd /tmp/pub
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _probe/build_report.txt
            git commit -q -m "probe: firmware build report [skip ci]" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            cd /
            sleep 5
          done
          exit 1

      - name: Fail when the build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

  live:
    name: Live quote render check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --disable-pip-version-check pillow==13.0.0 freetype-py==2.5.1

      - name: Tests + live render
        run: |
          set -uo pipefail
          out=/tmp/live
          mkdir -p "$out"
          {
            echo "commit=${GITHUB_SHA}"
            echo "utc=$(date -u +%FT%TZ)"
            echo "=== tests ==="
            python3 device_brief/test_render_brief.py 2>&1 | tail -15
            echo "tests_exit=${PIPESTATUS[0]}"
            echo "=== fixtures check ==="
            python3 device_brief/fixtures_tool.py 2>&1
            echo "fixtures_exit=$?"
            echo "=== live render #1 ==="
            start=$(date +%s.%N)
            python3 device_brief/render_brief.py --out-dir "$out/panel" --require-live 2>&1
            echo "render1_exit=$?"
            echo "render1_seconds=$(python3 -c "import time,sys; print(round(time.time()-float(sys.argv[1]),2))" "$start")"
            echo "=== live render #2 (expect unchanged) ==="
            python3 device_brief/render_brief.py --out-dir "$out/panel" --require-live 2>&1
            echo "render2_exit=$?"
            ls -l "$out/panel" 2>&1
          } > "$out/log.txt" 2>&1
          cat "$out/log.txt"

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/pub
            git clone -q --depth 1 -b "${GITHUB_REF_NAME}" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pub || { sleep 5; continue; }
            rm -rf /tmp/pub/_probe/live
            mkdir -p /tmp/pub/_probe/live
            cp -r /tmp/live/. /tmp/pub/_probe/live/
            cd /tmp/pub
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A _probe/live
            git commit -q -m "probe: live render result [skip ci]" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            cd /
            sleep 5
          done
          exit 1
