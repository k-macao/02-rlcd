name: zz-probe

# 临时探针：在 Actions 执行机上实测汇率接口（沙箱访问不了行情主机）。合并前必须删除。
on:
  push:
    branches: ["arena/e4dbd6ef-02-rlcd"]
    paths: [".github/workflows/zz-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: probe fx endpoints
        run: |
          set +e
          mkdir -p _probe/fx2
          cat > /tmp/probe.py <<'PY'
          import pathlib, sys, time, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          OUT = pathlib.Path("_probe/fx2")
          OUT.mkdir(parents=True, exist_ok=True)
          LOG = []
          SINA_REFERER = "https://finance.sina.com.cn/"
          TENCENT = ("https://qt.gtimg.cn/q=sh000001,sz399001,sz399006,r_hkHSI,r_hkHSTECH,"
                     "usDJI,usIXIC,usINX,gzN225,gzKS11,gzKOSDAQ,whUSDHKD,whUSDCNY")
          SINA = "https://hq.sinajs.cn/list=rt_hkHSI,rt_hkHSTECH,fx_susdhkd,fx_susdkrw"
          NAVER_KR = "https://polling.finance.naver.com/api/realtime/domestic/index/KOSPI,KOSDAQ"
          NAVER_JP = "https://polling.finance.naver.com/api/realtime/worldstock/index/.N225,.TOPX"

          def log(text=""):
              print(text)
              LOG.append(text)

          def get(url, referer=None, timeout=8):
              headers = {"User-Agent": UA, "Accept": "*/*"}
              if referer:
                  headers["Referer"] = referer
              started = time.time()
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      body = response.read(262144)
                      return response.status, dict(response.headers), body, time.time() - started
              except Exception as exc:  # noqa: BLE001
                  return None, {}, repr(exc).encode(), time.time() - started

          def show(label, url, referer=None, encoding="gbk", save=None):
              status, headers, body, seconds = get(url, referer)
              log(f"## {label}")
              log(f"url={url}")
              log(f"status={status} bytes={len(body)} seconds={seconds:.2f}")
              log(body.decode(encoding, "replace").strip())
              log()
              if save:
                  (OUT / save).write_bytes(body)
              return status, body

          def utc():
              return time.strftime("%Y-%m-%d %H:%M:%S", time.gmtime())

          mode = sys.argv[1]
          if mode == "snapshot":
              log(f"snapshot started {utc()} UTC")
              # 最终地址的四个响应（同一时刻），用来核对解析与两边的一致性
              show("tencent final", TENCENT, None, "gbk", "tencent_quotes.txt")
              show("sina final", SINA, SINA_REFERER, "gb18030", "sina_hk.txt")
              show("naver kr", NAVER_KR, None, "utf-8", "naver_kr.json")
              show("naver jp", NAVER_JP, None, "utf-8", "naver_jp.json")
              # 一次请求里夹一个不存在的代码，其余代码还返回吗？
              show("tencent mixed unknown", "https://qt.gtimg.cn/q=sh000001,whUSDKRW,sz399001,whUSDHKD")
              show("tencent unknown first", "https://qt.gtimg.cn/q=whUSDKRW,sh000001")
              show("sina mixed unknown", "https://hq.sinajs.cn/list=rt_hkHSI,fx_snosuch,fx_susdkrw",
                   SINA_REFERER, "gb18030")
              # 腾讯还有没有别的韩元写法
              for symbol in ("whKRWUSD whKRWJPY whJPYKRW whEURKRW whKRWCNH fxKRWCNY fxCNYKRW "
                             "fxKRWUSD fxKRWHKD fxHKDKRW whUSDKRWX whKRW whUSDKOR "
                             "fxUSDKRWC whHKDUSD whCNYUSD whEURUSD").split():
                  status, headers, body, seconds = get("https://qt.gtimg.cn/q=" + symbol)
                  text = body.decode("gbk", "replace").strip()
                  log(f"tencent {symbol:<12} status={status} bytes={len(body):>4} :: {text[:200]}")
              log()
              log(f"snapshot finished {utc()} UTC")
              (OUT / "snapshot_summary.txt").write_text("\n".join(LOG) + "\n", encoding="utf-8")
          else:
              # 昨收价在一段时间内稳不稳：每 60 秒记一次两边的 最新 / 昨收
              rounds = int(sys.argv[2])
              log(f"series started {utc()} UTC")
              for index in range(rounds):
                  stamp = time.strftime("%H:%M:%S", time.gmtime())
                  status, headers, body, seconds = get("https://qt.gtimg.cn/q=whUSDHKD,whUSDCNY")
                  for line in body.decode("gbk", "replace").strip().splitlines():
                      fields = line.split('"')[1].split("~") if '"' in line else []
                      if len(fields) > 11:
                          log(f"[{stamp}] T {fields[2]} last={fields[3]} time={fields[5]} "
                              f"prev={fields[6]} open={fields[7]} bid={fields[10]} ask={fields[11]} "
                              f"date={fields[-1]}")
                      else:
                          log(f"[{stamp}] T ?? {line[:160]}")
                  status, headers, body, seconds = get(
                      "https://hq.sinajs.cn/list=fx_susdhkd,fx_susdkrw", SINA_REFERER)
                  for line in body.decode("gb18030", "replace").strip().splitlines():
                      fields = line.split('"')[1].split(",") if '"' in line else []
                      if len(fields) > 8:
                          log(f"[{stamp}] S {line.split('=')[0][-10:]} time={fields[0]} bid={fields[1]} "
                              f"ask={fields[2]} prev={fields[3]} open={fields[5]} last={fields[8]} "
                              f"date={fields[-1]}")
                      else:
                          log(f"[{stamp}] S ?? {line[:160]}")
                  if index + 1 < rounds:
                      time.sleep(60)
              log(f"series finished {utc()} UTC")
              (OUT / "series_summary.txt").write_text("\n".join(LOG) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push_results() {
            git add _probe
            git commit -q -m "probe: $1 [skip ci]"
            for attempt in 1 2 3; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 3
            done
            echo "::notice title=probe::$1 pushed $(git rev-parse --short HEAD)"
          }
          python3 /tmp/probe.py snapshot
          echo "snapshot exit=$?"
          push_results "fx snapshot"
          python3 /tmp/probe.py series 16
          echo "series exit=$?"
          push_results "fx series"
