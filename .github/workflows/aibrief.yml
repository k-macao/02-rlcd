name: 生成章鱼AI 简报设备图

on:
  schedule:
    # 每天两次实时抓取：北京时间 07:10（UTC 23:10）与 19:10（UTC 11:10）。
    - cron: "10 23 * * *"
    - cron: "10 11 * * *"
  push:
    branches: ["**"]
    # 仅在自身或渲染器变更时触发：排版改动（如字号）应立即换图，不等次日定时任务；
    # 日常靠定时任务与手动触发，避免和 OTA 清单提交抢写 main。
    paths:
      - ".github/workflows/aibrief.yml"
      - "device_brief/render_brief.py"
      - "device_brief/mono_text.py"
      - "device_brief/test_render_brief.py"
      - "device_brief/fonts/**"
      - "002/**"
      - "05/**"
  workflow_dispatch:
    inputs:
      min_live_sources:
        description: "至少多少个数据源抓到实时内容才更新设备图"
        required: false
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: aibrief-device-image
  cancel-in-progress: false

jobs:
  render:
    name: 渲染 400x300 单色图并提交
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装渲染依赖
        run: python3 -m pip install --disable-pip-version-check pillow freetype-py

      - name: 推送前运行逐页排版回归测试
        run: python3 device_brief/test_render_brief.py

      - name: 抓取 002 数据并渲染多页
        env:
          MIN_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.min_live_sources || '20' }}
          BRIEF_FETCH_WORKERS: "16"
        run: |
          set -euo pipefail
          python3 device_brief/render_brief.py \
            --out-dir aibrief \
            --require-live \
            --require-fresh-market \
            --min-live-sources "$MIN_LIVE"
          python3 - <<'PY'
          import json
          meta = json.load(open("aibrief/meta.json", encoding="utf-8"))
          print(f"实时源 {meta['live_sources']}/{meta['total_sources']} · {meta['pages']}页 · 字体 {meta.get('font','')} · 生成 {meta['generated_at']}")
          print(f"版式 {meta.get('layout','')} · 预检 {meta.get('layout_validated')} · 快讯每源 {meta.get('news_per_source')} 条 · 收录 {meta.get('news_included')}/{meta.get('news_available')}")
          freshness = meta.get("market_freshness") or {}
          print(f"行情新鲜度 {freshness.get('ok')} · {freshness.get('reason','')}")
          print(f"文件大小 {meta['bytes']} bytes")
          PY
          ls -lh aibrief/

      - name: 提交设备图
        run: |
          set -euo pipefail
          if git diff --quiet -- aibrief; then
            echo "设备图无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aibrief
          git commit -m "Update AI brief device image [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 保存产物
        uses: actions/upload-artifact@v4
        with:
          name: aibrief-device-image
          path: |
            aibrief/latest.bin
            aibrief/latest.png
            aibrief/latest_combined.png
            aibrief/latest_contact_sheet.png
            aibrief/page_*.png
            aibrief/meta.json
          if-no-files-found: error
          retention-days: 14
